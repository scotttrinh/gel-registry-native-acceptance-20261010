name: Fixture product native packaging
on:
  workflow_dispatch:
    inputs:
      source_tag:
        required: true
        type: string
      repack:
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  packages:
    runs-on: ubuntu-24.04
    environment: package-signing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.6'
      - run: sudo apt-get update && sudo apt-get install -y rpm gnupg zstd
      - uses: gelstable/gel-registry/.github/actions/setup-nfpm@6e4c873bbb4c56e8805cd41387871af64558e31d
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          REPACK: ${{ inputs.repack }}
        run: |
          python3 .github/scripts/fixture-package.py
          if test -f /tmp/fixture-tag; then echo "tag=$(cat /tmp/fixture-tag)" >> "$GITHUB_OUTPUT"; fi
      - if: steps.plan.outputs.tag != ''
        uses: gelstable/gel-registry/.github/actions/sign-rpms@6e4c873bbb4c56e8805cd41387871af64558e31d
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          PACKAGE_SIGNING_FPR: ${{ secrets.PACKAGE_SIGNING_FPR }}
        with:
          directory: packages
      - if: steps.plan.outputs.tag != ''
        uses: gelstable/gel-registry/.github/actions/publish-native-release@6e4c873bbb4c56e8805cd41387871af64558e31d
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          directory: packages
          tag: ${{ steps.plan.outputs.tag }}
