name: Shared native action acceptance
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  actions:
    runs-on: ubuntu-24.04
    environment: package-signing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.6'
      - run: sudo apt-get update && sudo apt-get install -y rpm gnupg zstd
      - uses: gelstable/gel-registry/.github/actions/setup-nfpm@50ec2b2db4d583282a40a3baae70722c00a0a3f0
      - uses: gelstable/gel-registry/.github/actions/native-plan@50ec2b2db4d583282a40a3baae70722c00a0a3f0
        id: server
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          product: server
          source_tag: v7.1
      - name: Verify live server source plan
        env:
          PLAN: ${{ steps.server.outputs.plan }}
        run: python3 -c 'import json,os; p=json.loads(os.environ["PLAN"]); assert len(p)==1 and p[0]["slot"]=="7" and set(p[0]["sources"])=={"x86_64","aarch64"}'
      - uses: gelstable/gel-registry/.github/actions/native-plan@50ec2b2db4d583282a40a3baae70722c00a0a3f0
        id: postgis
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          product: postgis
          source_tag: legacy-gel-server-6-ext-postgis
      - name: Verify live legacy PostGIS source plan
        env:
          PLAN: ${{ steps.postgis.outputs.plan }}
        run: python3 -c 'import json,os; p=json.loads(os.environ["PLAN"]); assert len(p)==1; assert "c6766e7" in p[0]["sources"]["x86_64"]["url"]; assert "edaa7ce" in p[0]["sources"]["aarch64"]["url"]'
      - name: Create fixture portable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fixture/gel-server-7.1
          printf 'fixture source\n' > fixture/gel-server-7.1/content
          tar --zstd -cf /tmp/gel-server-x86_64-unknown-linux-gnu.tar.zst -C fixture gel-server-7.1
          cp /tmp/gel-server-x86_64-unknown-linux-gnu.tar.zst /tmp/gel-server-aarch64-unknown-linux-gnu.tar.zst
          if ! gh release view v7.1 >/dev/null 2>&1; then
            gh release create v7.1 /tmp/gel-server-*-unknown-linux-gnu.tar.zst --title 'Disposable portable fixture' --target "$GITHUB_SHA"
          fi
      - name: Plan and build fixture revision one
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: v7.1
          REPACK: 'false'
        run: python3 .github/scripts/fixture-package.py
      - uses: gelstable/gel-registry/.github/actions/sign-rpms@50ec2b2db4d583282a40a3baae70722c00a0a3f0
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          PACKAGE_SIGNING_FPR: ${{ secrets.PACKAGE_SIGNING_FPR }}
        with:
          directory: packages
      - uses: gelstable/gel-registry/.github/actions/native-manifest@50ec2b2db4d583282a40a3baae70722c00a0a3f0
        id: manifest
        with:
          directory: packages
          repository: ${{ github.repository }}
          tag: pkg-gel-7-7.1-1
      - name: Write and inspect final manifest
        env:
          NATIVE: ${{ steps.manifest.outputs.native }}
        run: |
          python3 -c 'import json,os,pathlib; n=json.loads(os.environ["NATIVE"]); assert len(n["packages"])==4; pathlib.Path("/tmp/gel-registry.json").write_text(json.dumps({"schema_version":2,"native":n}))'
      - uses: gelstable/gel-registry/.github/actions/check-manifest@50ec2b2db4d583282a40a3baae70722c00a0a3f0
        with:
          file: /tmp/gel-registry.json
      - uses: gelstable/gel-registry/.github/actions/publish-native-release@50ec2b2db4d583282a40a3baae70722c00a0a3f0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          directory: packages
          tag: pkg-gel-7-7.1-1
